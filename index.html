<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>吴英迪AI工具助手</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:420px;
    text-align:center;
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:18px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<div class="box">

<h1>🤖 AI工具助手</h1>

<p>欢迎来到吴英迪AI平台</p>

<input
id="question"
placeholder="请输入你的问题">

<button onclick="startChat()">
开始聊天
</button>

</div>

<script>

function startChat(){

let text=document.getElementById("question").value;

if(text==""){

alert("请输入问题");

return;

}

window.open(
"https://chat.openai.com/?q="+encodeURIComponent(text),
"_blank"
);

}

</script>

</body>

</html>
